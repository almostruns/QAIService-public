name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Generate isolated test credentials
        shell: bash
        run: |
          set -euo pipefail
          echo "QAI_DB_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "QAI_DB_ROOT_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Release service image
        run: docker compose build server
